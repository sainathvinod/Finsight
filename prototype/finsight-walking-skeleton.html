<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FinSight — Walking Skeleton Prototype</title>
<style>
  /* FinSight tokens (08-ui-design-system.md) — light-first, color-independent meaning, brand-swappable. Enterprise-dense. */
  :root{
    --n0:#FFFFFF;--n25:#FBFCFE;--n50:#F4F6F9;--n100:#EAEEF3;--n200:#DCE2EA;--n300:#C2CAD6;--n400:#98A2B3;--n500:#6B7686;--n600:#4B5568;--n700:#343D4D;--n800:#222A36;--n900:#131922;
    --p50:#EBF2FC;--p100:#D2E2F7;--p200:#A9C6EE;--p500:#215FA8;--p600:#184C8A;--p700:#123B6E;--p800:#0E2E54;
    --teal50:#E6F3F3;--teal500:#0F7B82;--teal600:#0B646A;
    --ok:#1E7A46;--ok50:#E7F4EC;--warn:#A5670C;--warn50:#FBF1DC;--dng:#B42318;--dng50:#FBEAE8;--info:#1570CD;--info50:#E7F1FC;
    --sc:#B42318;--sh:#C15211;--sm:#2A6DB0;--sl:#5B6675;
    --canvas:var(--n50);--raised:var(--n0);--sunken:var(--n100);--border:var(--n200);--bstrong:var(--n300);
    --tp:var(--n800);--ts:var(--n600);--tm:var(--n500);--act:var(--p600);--acth:var(--p700);--focus:var(--p500);--link:var(--p600);
    --r-sm:4px;--r-md:6px;--r-lg:8px;--fs:15px;
    --font:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --sh1:0 1px 2px rgba(19,25,34,.06);--sh2:0 6px 22px rgba(19,25,34,.14);
  }
  :root[data-theme="dark"]{
    --canvas:#0F141B;--raised:#1A222D;--sunken:#151C25;--border:#2A3644;--bstrong:#3A4A5C;
    --tp:#EAEEF3;--ts:#C2CAD6;--tm:#98A2B3;--act:#4E86D6;--acth:#6E9CDD;--focus:#6E9CDD;--link:#8FB6F0;
    --n0:#1A222D;--n25:#0F141B;--n50:#151C25;--n100:#202A36;
    --ok50:#12251a;--warn50:#2a2110;--dng50:#2a1512;--info50:#12212f;--p50:#152436;
    --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 6px 22px rgba(0,0,0,.55);
  }
  :root[data-textsize="large"]{--fs:16.5px;} :root[data-textsize="larger"]{--fs:18px;}
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:var(--font);font-size:var(--fs);color:var(--tp);background:var(--canvas);line-height:1.4;-webkit-font-smoothing:antialiased;}
  .tnum{font-variant-numeric:tabular-nums;} h1,h2,h3,h4{margin:0 0 8px;font-weight:600;color:var(--tp);}
  h1{font-size:1.5rem;} h2{font-size:1.2rem;} h3{font-size:1.02rem;} h4{font-size:.92rem;}
  p{margin:0 0 8px;color:var(--ts);} a{color:var(--link);}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px;}
  .muted{color:var(--tm);} .sec{color:var(--ts);}
  .ov{font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tm);}
  .skip{position:absolute;left:-999px;top:0;background:var(--act);color:#fff;padding:8px 12px;z-index:100;} .skip:focus{left:8px;top:8px;}
  .proto-banner{background:var(--info50);color:var(--info);text-align:center;font-size:.74rem;padding:4px;font-weight:600;}

  .shell{display:grid;grid-template-columns:210px 1fr;grid-template-rows:auto 1fr;min-height:100vh;grid-template-areas:"side top" "side main";}
  .side{grid-area:side;background:var(--raised);border-right:1px solid var(--border);padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.02rem;padding:6px 8px 14px;}
  .brand .lg{width:26px;height:26px;border-radius:6px;background:var(--act);color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700;}
  .nav{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;border-radius:var(--r-md);padding:8px 9px;font:inherit;color:var(--ts);cursor:pointer;}
  .nav:hover{background:var(--sunken);} .nav[aria-current="page"]{background:var(--p50);color:var(--act);font-weight:600;}
  .nav .i{width:16px;text-align:center;} .nav .cnt{margin-left:auto;font-size:.72rem;background:var(--sunken);border-radius:999px;padding:0 7px;color:var(--ts);}
  .navsp{flex:1;} .side .hint{font-size:.68rem;color:var(--tm);padding:2px 8px;}
  .top{grid-area:top;background:var(--raised);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;}
  .top .rname{font-weight:600;} .top .right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .selwrap{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ts);}
  .sel{font:inherit;font-size:.82rem;padding:6px 8px;border:1px solid var(--bstrong);border-radius:var(--r-md);background:var(--raised);color:var(--tp);}
  main{grid-area:main;overflow:auto;}
  .page{max-width:1240px;margin:0 auto;padding:18px 20px 60px;}
  @media(max-width:900px){.shell{grid-template-columns:1fr;grid-template-areas:"top" "main";}.side{display:none;}}

  .pagehead{display:flex;align-items:flex-end;gap:14px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap;}
  .pagehead .crumb{font-size:.72rem;color:var(--tm);margin-bottom:2px;}
  .pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
  .lensbanner{font-size:.76rem;color:var(--ts);background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-md);padding:6px 10px;margin-bottom:14px;}

  .btn{font:inherit;font-weight:600;border-radius:var(--r-md);padding:8px 13px;min-height:36px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:7px;font-size:.86rem;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-p{background:var(--act);color:#fff;} .btn-p:hover:not(:disabled){background:var(--acth);}
  .btn-s{background:var(--raised);color:var(--tp);border-color:var(--bstrong);} .btn-s:hover{background:var(--sunken);}
  .btn-g{background:none;color:var(--act);border:none;} .btn-d{background:var(--dng);color:#fff;}
  .btn-sm{min-height:28px;padding:4px 9px;font-size:.78rem;} .btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .btn-fin{background:linear-gradient(0deg,var(--teal600),var(--teal500));color:#fff;} .btn-fin:hover{filter:brightness(1.06);}

  .panel{background:var(--raised);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh1);margin-bottom:14px;}
  .panel > .ph{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);}
  .panel > .ph h3{margin:0;font-size:.98rem;} .panel > .pb{padding:14px;}
  .grid{display:grid;gap:14px;} .g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:1fr 1fr 1fr;} .g4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:1000px){.g2,.g3,.g4{grid-template-columns:1fr;}}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
  @media(max-width:1000px){.kpis{grid-template-columns:1fr 1fr;}}
  .kpi{background:var(--raised);border:1px solid var(--border);border-left:3px solid var(--bstrong);border-radius:var(--r-md);padding:10px 12px;}
  .kpi.k-ok{border-left-color:var(--ok);} .kpi.k-warn{border-left-color:var(--warn);} .kpi.k-dng{border-left-color:var(--dng);} .kpi.k-info{border-left-color:var(--info);}
  .kpi .kl{font-size:.72rem;color:var(--tm);text-transform:uppercase;letter-spacing:.03em;}
  .kpi .kv{font-size:1.32rem;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0;}
  .kpi .kd{font-size:.76rem;color:var(--ts);}
  .up{color:var(--dng);font-weight:600;} .down{color:var(--ok);font-weight:600;} /* expense up = unfavorable */

  table{width:100%;border-collapse:collapse;font-size:.84rem;} .tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-md);}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);} th{background:var(--sunken);font-weight:600;font-size:.74rem;color:var(--ts);position:sticky;top:0;}
  tr:last-child td{border-bottom:none;} td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;} tbody tr:hover{background:var(--sunken);}
  tr.click{cursor:pointer;}
  .fav{color:var(--ok);font-weight:600;} .unf{color:var(--dng);font-weight:600;}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:600;border:1px solid var(--bstrong);background:var(--sunken);color:var(--ts);}
  .chip.ok{background:var(--ok50);color:var(--ok);border-color:transparent;} .chip.warn{background:var(--warn50);color:var(--warn);border-color:transparent;}
  .chip.dng{background:var(--dng50);color:var(--dng);border-color:transparent;} .chip.info{background:var(--info50);color:var(--info);border-color:transparent;}
  .sev{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.78rem;}
  .sev-c{color:var(--sc);} .sev-h{color:var(--sh);} .sev-m{color:var(--sm);} .sev-l{color:var(--sl);}
  .sq{display:inline-block;} .sq-oct{width:12px;height:12px;background:var(--sc);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);}
  .sq-tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid var(--sh);}
  .sq-dia{width:10px;height:10px;background:var(--sm);transform:rotate(45deg);} .sq-dot{width:10px;height:10px;border-radius:50%;background:var(--sl);}

  .alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r-md);border:1px solid var(--border);margin-bottom:10px;background:var(--sunken);}
  .alert .ai{font-weight:700;} .alert.ok{background:var(--ok50);border-color:transparent;} .alert.ok .ai{color:var(--ok);}
  .alert.warn{background:var(--warn50);border-color:transparent;} .alert.warn .ai{color:var(--warn);}
  .alert.dng{background:var(--dng50);border-color:transparent;} .alert.dng .ai{color:var(--dng);}
  .alert.info{background:var(--info50);border-color:transparent;} .alert.info .ai{color:var(--info);} .alert b{color:var(--tp);}

  /* stepper */
  .stepband{background:var(--raised);border-bottom:1px solid var(--border);padding:12px 20px 0;} .stepband .w{max-width:1240px;margin:0 auto;}
  .stepnow{font-size:.74rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--act);margin-bottom:6px;}
  .stepper{display:flex;list-style:none;margin:0;padding:0 0 12px;overflow-x:auto;} .stepper li{display:flex;align-items:center;gap:6px;flex:1;min-width:66px;}
  .stepper .nd{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.74rem;font-weight:600;border:2px solid var(--bstrong);color:var(--tm);background:var(--raised);flex:none;}
  .stepper .lb{font-size:.68rem;color:var(--tm);white-space:nowrap;} .stepper .cn{height:2px;background:var(--border);flex:1;min-width:6px;}
  .stepper li.done .nd{background:var(--ok);border-color:var(--ok);color:#fff;} .stepper li.done .lb{color:var(--ts);}
  .stepper li.cur .nd{background:var(--act);border-color:var(--act);color:#fff;} .stepper li.cur .lb{color:var(--act);font-weight:700;}
  .stepper li.gate .nd::after{content:"🔒";font-size:.55rem;} .back{background:none;border:none;color:var(--link);font:inherit;cursor:pointer;padding:0;margin-bottom:12px;}

  /* tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto;}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 12px;font:inherit;font-size:.84rem;color:var(--ts);cursor:pointer;white-space:nowrap;}
  .tab:hover{color:var(--tp);} .tab[aria-selected="true"]{color:var(--act);border-bottom-color:var(--act);font-weight:600;}

  /* filter bar */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 10px;margin-bottom:12px;}
  .filters label{font-size:.72rem;color:var(--tm);display:flex;flex-direction:column;gap:3px;}
  .filters .sel,.filters input{font-size:.8rem;padding:5px 7px;}

  /* charts */
  .chart{margin:0;} .chart .ct{font-weight:600;font-size:.9rem;margin-bottom:2px;} .chart .cs{font-size:.74rem;color:var(--tm);margin-bottom:8px;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;margin-top:8px;} .legend span{display:inline-flex;align-items:center;gap:5px;}
  .lgsw{width:11px;height:11px;border-radius:2px;display:inline-block;}
  svg text{font-family:var(--font);}
  details.dt{margin-top:8px;font-size:.78rem;} details.dt summary{cursor:pointer;color:var(--link);}

  /* review row / slots */
  .revrow{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;background:var(--raised);}
  .revrow .rt{font-weight:600;min-width:130px;} .revrow .rs{flex:1;}
  .slot{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px dashed var(--bstrong);border-radius:var(--r-md);margin-bottom:8px;background:var(--sunken);}
  .slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok50);} .slot.err{border-style:solid;border-color:var(--dng);background:var(--dng50);}
  .slot.warn{border-style:solid;border-color:var(--warn);background:var(--warn50);} .slot .st{font-weight:600;min-width:150px;} .slot .sd{flex:1;color:var(--ts);font-size:.8rem;}
  .demoflag{font-size:.66rem;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:1px 5px;font-weight:700;}

  /* overlays */
  .scrim{position:fixed;inset:0;background:rgba(19,25,34,.42);display:none;z-index:50;} .scrim.open{display:block;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--raised);box-shadow:var(--sh2);transform:translateX(100%);transition:transform .2s ease-out;z-index:60;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .fin{position:fixed;top:0;right:0;height:100%;width:min(420px,94vw);background:var(--raised);box-shadow:var(--sh2);transform:translateX(100%);transition:transform .2s ease-out;z-index:65;display:flex;flex-direction:column;border-left:3px solid var(--teal500);}
  .fin.open{transform:translateX(0);}
  .modal{position:fixed;inset:0;display:none;place-items:center;z-index:70;padding:16px;} .modal.open{display:grid;}
  .modal .box{background:var(--raised);border-radius:var(--r-lg);box-shadow:var(--sh2);max-width:560px;width:100%;padding:18px;max-height:90vh;overflow:auto;}
  .dhead{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;} .dbody{padding:14px;overflow:auto;}
  .close{margin-left:auto;background:none;border:none;font-size:1.25rem;cursor:pointer;color:var(--tm);}
  @media(prefers-reduced-motion:reduce){.drawer,.fin{transition:none;}}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:.85rem;} .kv dt{color:var(--tm);} .kv dd{margin:0;font-variant-numeric:tabular-nums;}
  .field{margin-bottom:12px;} .field label{display:block;font-weight:600;font-size:.82rem;margin-bottom:5px;}
  .field select,.field input{font:inherit;padding:8px 10px;border:1px solid var(--bstrong);border-radius:var(--r-md);background:var(--raised);color:var(--tp);width:240px;max-width:100%;}
  input.cell{width:100%;font:inherit;font-size:.82rem;padding:4px 6px;border:1px solid var(--bstrong);border-radius:4px;background:var(--raised);color:var(--tp);} input.cell.num{text-align:right;font-variant-numeric:tabular-nums;}
  td.edited{background:var(--warn50);} .editbadge{font-size:.64rem;color:var(--warn);font-weight:700;border:1px solid var(--warn);border-radius:3px;padding:0 4px;margin-left:5px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--n800);color:#fff;padding:10px 16px;border-radius:var(--r-md);box-shadow:var(--sh2);z-index:90;font-size:.85rem;opacity:0;transition:opacity .2s;} .toast.show{opacity:1;}
  .rag{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);} .rag.warn{background:var(--warn50);} .rag.ok{background:var(--ok50);} .rag.dng{background:var(--dng50);} .ragi{font-size:1.5rem;}
  .aislot{border:1px solid var(--border);border-left:3px solid var(--n300);background:var(--sunken);border-radius:var(--r-md);padding:11px;font-size:.8rem;color:var(--tm);}
  .stage{display:flex;align-items:center;gap:9px;padding:6px 0;color:var(--ts);} .stage .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--bstrong);display:grid;place-items:center;font-size:.55rem;}
  .stage.done .dot{background:var(--ok);border-color:var(--ok);color:#fff;} .stage.active .dot{border-color:var(--act);border-top-color:transparent;animation:spin .8s linear infinite;} .stage.done,.stage.active{color:var(--tp);font-weight:500;}
  @keyframes spin{to{transform:rotate(360deg);}} @media(prefers-reduced-motion:reduce){.stage.active .dot{animation:none;}}
  .cov{height:14px;background:var(--sunken);border-radius:7px;overflow:hidden;border:1px solid var(--border);} .cov > i{display:block;height:100%;background:var(--ok);}
  .pill{background:var(--sunken);border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-size:.74rem;font-weight:600;color:var(--ts);}
  .factbox{background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;margin:8px 0;font-size:.85rem;}
  .finq{display:block;width:100%;text-align:left;background:var(--sunken);border:1px solid var(--border);border-radius:var(--r-md);padding:7px 10px;margin-bottom:6px;font:inherit;font-size:.8rem;color:var(--tp);cursor:pointer;} .finq:hover{border-color:var(--act);}
  .finmsg{margin-bottom:12px;} .finmsg .who{font-size:.72rem;color:var(--tm);font-weight:600;text-transform:uppercase;margin-bottom:3px;}
</style>
</head>
<body>
<a href="#main" class="skip">Skip to content</a>
<div class="proto-banner">PROTOTYPE — clearly-synthetic demonstration data, in-memory only. Not production. Thresholds shown as “Configured Value”. Fin explains; it never creates financial values, findings, or actions.</div>
<div class="shell">
  <nav class="side" aria-label="Primary">
    <div class="brand" style="cursor:pointer;" title="Welcome / home" onclick="go('welcome')"><span class="lg">FS</span> FinSight</div>
    <button class="nav" data-nav="welcome"><span class="i">⌂</span> Welcome</button>
    <button class="nav" data-nav="dashboard"><span class="i">▦</span> Dashboard</button>
    <button class="nav" data-nav="review"><span class="i">▤</span> Financial Review</button>
    <button class="nav" data-nav="findings"><span class="i">⚑</span> Findings <span class="cnt" id="navFind">0</span></button>
    <button class="nav" data-nav="decisions"><span class="i">◈</span> Decisions <span class="cnt" id="navDec">0</span></button>
    <button class="nav" data-nav="compare"><span class="i">⇄</span> Compare</button>
    <button class="nav" data-nav="whatsnew"><span class="i">✦</span> What's New</button>
    <button class="nav" data-nav="audit"><span class="i">◷</span> Audit</button>
    <button class="nav" data-nav="settings"><span class="i">⚙</span> Settings</button>
    <button class="nav" data-nav="help"><span class="i">?</span> Help</button>
    <div class="navsp"></div>
    <button class="btn btn-fin btn-sm" id="finBtnSide" style="margin:6px 4px;">✦ Ask Fin</button>
    <div class="hint">Monthly Review in a Box</div>
  </nav>
  <header class="top">
    <span class="rname" id="topReview">FinSight</span>
    <div class="right">
      <span class="selwrap">Period <select class="sel" id="periodSel"><option>July 2026</option><option>June 2026</option><option>May 2026</option></select></span>
      <span class="selwrap">Lens <select class="sel" id="lensSel"><option value="Operator">Operator</option><option value="Leader" selected>Leader</option><option value="Auditor">Auditor</option></select></span>
      <button class="btn btn-fin btn-sm" id="finBtnTop">✦ Ask Fin</button>
      <button class="btn btn-s btn-sm" id="textBtn" title="Text size" aria-label="Cycle text size">A±</button>
      <button class="btn btn-s btn-sm" id="themeBtn" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="dhead"><strong id="drawerTitle">Details</strong><button class="close" id="drawerClose" aria-label="Close">×</button></div>
  <div class="dbody" id="drawerBody"></div>

function lineTrend(pts){
  const W=560,H=170,pad=36,max=Math.max(...pts.map(p=>p.v)),min=Math.min(...pts.map(p=>p.v));
  const x=i=>pad+i*((W-pad*2)/(pts.length-1)), y=v=>H-26-((v-min)/((max-min)||1))*(H-58);
  const poly=pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ");
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3" fill="var(--act)"></circle><text x="${x(i)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--tm)">${p.m}</text><text x="${x(i)}" y="${y(p.v)-7}" font-size="8.5" text-anchor="middle" fill="var(--ts)">${(p.v/1000).toFixed(0)}k</text>`).join("");
  const inner=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly total spend trend"><polyline points="${poly}" fill="none" stroke="var(--act)" stroke-width="2"></polyline>${dots}</svg>`;
  const table=`<div class="tw"><table><thead><tr><th>Month</th><th class="num">Total spend</th></tr></thead><tbody>${pts.map(p=>`<tr><td>${p.m}</td><td class="num tnum">${money(p.v)}</td></tr>`).join("")}</tbody></table></div>`;
  return {inner,table};
}
function diverging(A){
  const s=A.slice().sort((a,b)=>b.varAmt-a.varAmt); const max=Math.max(...s.map(a=>Math.abs(a.varAmt)))||1;
  const inner=s.map(a=>{ const w=Math.abs(a.varAmt)/max*100, over=a.varAmt>0; return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:.74rem;">
    <span style="width:160px;">${a.code} ${esc(a.name)}</span>
    <div style="flex:1;display:flex;align-items:center;"><div style="width:50%;display:flex;justify-content:flex-end;">${over?'':`<div style="width:${w}%;height:12px;background:var(--ok);border-radius:2px;"></div>`}</div><div style="width:1px;height:16px;background:var(--bstrong);"></div><div style="width:50%;">${over?`<div style="width:${w}%;height:12px;background:var(--dng);border-radius:2px;"></div>`:''}</div></div>
    <span class="tnum ${over?'unf':'fav'}" style="width:120px;text-align:right;">${over?'▲ over ':'▼ under '}${money(Math.abs(a.varAmt))}</span></div>`; }).join("");
  const legend=`<div class="legend"><span><span class="lgsw" style="background:var(--ok)"></span>▼ Favorable (under budget)</span><span><span class="lgsw" style="background:var(--dng)"></span>▲ Unfavorable (over budget)</span></div>`;
  return {inner:inner+legend,table:null};
}
function donut(c){
  const total=c.critical+c.high+c.medium+c.low||1;
  const segs=[["Critical","var(--sc)",c.critical],["High","var(--sh)",c.high],["Medium","var(--sm)",c.medium],["Low","var(--sl)",c.low]];
  let a0=-Math.PI/2; const R=52,CX=60,CY=60;
  const arcs=segs.map(([k,col,n])=>{ if(!n) return ""; const frac=n/total,a1=a0+frac*2*Math.PI,large=frac>0.5?1:0; const x0=CX+R*Math.cos(a0),y0=CY+R*Math.sin(a0),x1=CX+R*Math.cos(a1),y1=CY+R*Math.sin(a1); const p=`<path d="M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${R} ${R} 0 ${large} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="17"></path>`; a0=a1; return p; }).join("");
  const legend=segs.map(([k,col,n])=>`<span><span class="lgsw" style="background:${col}"></span>${k} <b>${n}</b></span>`).join("");
  const inner=`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;"><svg viewBox="0 0 120 120" width="118" role="img" aria-label="Findings by severity"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--sunken)" stroke-width="17"></circle>${arcs}<text x="60" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="var(--tp)">${total}</text><text x="60" y="74" text-anchor="middle" font-size="9" fill="var(--tm)">findings</text></svg><div class="legend" style="flex-direction:column;gap:7px;">${legend}</div></div>`;
  return {inner,table:null};
}
function coverageBlock(){
  const c=coverage(), p=verifiedPct();
  const src=c.sources.map(([n,st])=>{ const m={valid:["ok","✓ Valid"],"missing-opt":["","○ Missing (optional)"],deferred:["","— Deferred"],failed:["dng","✕ Failed"]}[st]; return `<div style="display:flex;justify-content:space-between;font-size:.78rem;padding:3px 0;"><span>${n}</span><span class="chip ${m[0]}">${m[1]}</span></div>`; }).join("");
  const inner=`<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:4px;"><span>Verification coverage</span><b class="tnum">${p}%</b></div><div class="cov"><i style="width:${p}%;"></i></div></div>
    <div class="kv" style="margin:10px 0;"><dt>Rows extracted</dt><dd>${c.totalRows}</dd><dt>Accepted</dt><dd>${c.accepted}</dd><dt>Edited</dt><dd>${c.edited}</dd><dt>Low-confidence</dt><dd>${c.lowConf}</dd><dt>Duplicate candidates</dt><dd>${c.duplicates}</dd><dt>Period mismatches</dt><dd>${c.periodMismatch}</dd><dt>Rejected</dt><dd>${c.rejected}</dd></div>${src}`;
  return inner;
}

function readiness(){
  const r=curr()||{docs:demoDocs()}; const d=r.docs; const has=k=>d[k]&&d[k].ok; const failed=k=>d[k]&&!d[k].ok;
  function ds(key,req,deferred){ if(deferred) return "deferred"; if(failed(key)) return "failed"; if(has(key)) return key==="ged"?"warn":"valid"; return req?"missing-req":"missing-opt"; }
  const docs=[
    {key:"ged",name:"GED Report",req:true,state:ds("ged",true,false)},
    {key:"budget",name:"Budget Tracker",req:true,state:ds("budget",true,false)},
    {key:"invoices",name:"Invoices",req:false,state:ds("invoices",false,true)},
    {key:"resources",name:"Resource Sheet",req:false,state:ds("resources",false,false)},
    {key:"contracts",name:"Contracts / SOWs",req:false,state:ds("contracts",false,false)},
    {key:"ratecards",name:"Rate Cards",req:false,state:ds("ratecards",false,true)},
  ];
  const caps=[
    {cap:"Budget Analysis",ready:has("ged")&&has("budget"),missing:[!has("ged")?"GED Report":null,!has("budget")?"Budget Tracker":null].filter(Boolean)},
    {cap:"GED Analysis",ready:has("ged"),missing:[!has("ged")?"GED Report":null].filter(Boolean)},
    {cap:"Reconciliation",ready:has("ged")&&has("budget"),missing:[!has("ged")?"GED Report":null,!has("budget")?"Budget Tracker":null].filter(Boolean)},
    {cap:"Invoice Validation",ready:false,missing:["Invoices","Rate Cards"],deferred:true},
    {cap:"Resource Analysis",ready:has("resources"),missing:["Resource Sheet"]},
  ];
  return {docs,caps};
}

function origVal(id,f){ const t=TXN.find(x=>x.id===id); return t[f]; }
function setEdit(id,f,val){ state.edits[id]=state.edits[id]||{}; if(String(val)===String(origVal(id,f))) delete state.edits[id][f]; else state.edits[id][f]=val; if(!Object.keys(state.edits[id]).length) delete state.edits[id]; }

function isSavedEdited(id,f){ return state.savedEdits[id]&&state.savedEdits[id][f]; }
function hasUnsaved(){ return Object.keys(state.edits).length>0; }
function lcResolved(){ return TXN.filter(t=>t.conf==="low").every(t=>state.lcAccepted&&state.lcAccepted[t.id]); }
function validationErrors(){ const errs=[]; Object.keys(state.edits).forEach(id=>{ const e=state.edits[id]; Object.keys(e).forEach(f=>{ const v=e[f]; if((f==="vendor"||f==="account"||f==="amount"||f==="date")&&String(v).trim()===""){ errs.push(id+" · "+f+" is empty"); } if(f==="amount"&&isNaN(parseFloat(v))){ errs.push(id+" · amount is not a number"); } }); }); return errs; }

      <div class="panel"><div class="ph"><h3>Material changes from prior period</h3></div><div class="pb"><ul style="margin:0;padding-left:18px;font-size:.86rem;">
        <li>Total spend up ${money(t.mom)} (${pct(t.momPct)}) vs June.</li>
        <li>Ironclad Contract Labor up ${money(vendorByName("Ironclad Contract Labor").change)}; Northstar up ${money(vendorByName("Northstar Technology Services").change)}.</li>
        <li>Cloud Infrastructure now favorable vs prior; Marketing under budget.</li></ul></div></div>
      <div class="panel"><div class="ph"><h3>Findings &amp; decisions</h3></div><div class="pb">
        <div class="kv"><dt>New findings</dt><dd>${FINDINGS.filter(f=>f.status==="New").length}</dd><dt>Open findings</dt><dd>${openF.length}</dd><dt>Resolved / dismissed</dt><dd>${closed.length}</dd><dt>Decisions required</dt><dd>${decisionsList().length}</dd></div>
        <div class="btnrow" style="margin-top:8px;"><button class="btn btn-s btn-sm" onclick="go('findings')">Findings ›</button><button class="btn btn-s btn-sm" onclick="go('decisions')">Decisions ›</button></div></div></div>
    </div>
    <div class="panel"><div class="ph"><h3>Recommended attention areas</h3></div><div class="pb"><ul style="margin:0 0 8px;padding-left:18px;font-size:.88rem;">
      <li>Review the over-budget Professional Services account (6100) with Northstar before re-forecast.</li>
      <li>Confirm or dismiss the duplicate Software Licenses charge (6220, Meridian).</li>
      <li>Confirm additional consulting scope (6500, BluePeak) was approved.</li></ul>
      <div class="aislot">AI-narrative slot — labeled &amp; empty until AI is configured. This summary reads complete without it.</div></div></div>
    <div class="btnrow">${r.status!=="completed"?`<button class="btn btn-p" onclick="curr()&&(curr().step=8);go('complete')">Continue to Complete ›</button>`:`<button class="btn btn-p" onclick="go('dashboard')">Back to Dashboard</button>`}<button class="btn btn-s" onclick="exportSummary()">Export</button></div>
    <p class="muted" style="font-size:.76rem;">Every figure drills to its account/vendor/finding and source record. Synthetic demonstration data.</p>
  </div>`;
  return head + body;
}
function exportSummary(){ const r=curr()||{month:"July",year:"2026"}; drawer("Export / share", `<p class="sec">Self-describing, labeled output (survives as a shared PDF / email).</p>
  <div class="kv"><dt>Period</dt><dd>${esc(r.month+" "+r.year)}</dd><dt>Data as-of</dt><dd>Configured Value</dd><dt>Configuration version</dt><dd>Configured Value</dd><dt>Generated</dt><dd>(prototype)</dd><dt>AI content</dt><dd>None (labeled)</dd></div>
  <div class="btnrow" style="margin-top:14px;"><button class="btn btn-p" onclick="toast('Export prepared (prototype)')">Export summary (PDF)</button><button class="btn btn-s" onclick="toast('Export prepared (prototype)')">Export findings</button><button class="btn btn-s" onclick="toast('Export prepared (prototype)')">Export data</button></div>`); }

function viewAudit(){ const edits=Object.keys(state.savedEdits);
  return `<div class="page">${pagehead("Auditor","Audit trail",finBtn("Audit"))}${lensBanner()}
    <div class="panel"><div class="ph"><h3>Cycle timeline — July 2026 (synthetic)</h3></div><div class="pb"><div class="tw"><table><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead><tbody>
      <tr><td>(synthetic) 2026-08-03 08:55</td><td>Operator</td><td>Created review</td><td>July 2026</td></tr>
      <tr><td>08:58</td><td>Operator</td><td>Uploaded GED + Budget</td><td>provenance recorded (name, fingerprint, user, ts)</td></tr>
      <tr><td>09:05</td><td>Operator</td><td>Verification confirmed</td><td>Step 4 hard gate; ${edits.length} correction(s) saved</td></tr>
      <tr><td>09:12</td><td>System</td><td>Ran deterministic analysis</td><td>rule-set + config version = Configured Value</td></tr>
      ${FINDINGS.flatMap(f=>f.history.map(h=>`<tr><td>${esc(h.ts)}</td><td>${esc(h.actor)}</td><td>${esc(h.action)} ${f.id}</td><td>${esc(h.note||f.title)}</td></tr>`)).join("")}
    </tbody></table></div></div></div>
    <div class="grid g2"><div class="panel"><div class="ph"><h3>Edits / overrides</h3></div><div class="pb">${edits.length?edits.map(id=>Object.keys(state.savedEdits[id]).map(f=>{const e=state.savedEdits[id][f];return `<div class="factbox" style="font-size:.8rem;"><b>${id}.${f}</b>: ${esc(f==='amount'?money2(e.orig):e.orig)} → ${esc(f==='amount'?money2(e.val):e.val)} <span class="muted">(${e.actor}, ${e.ts})</span></div>`}).join("")).join(""):'<p class="muted">No edits recorded this session.</p>'}</div></div>
      <div class="panel"><div class="ph"><h3>Rules &amp; configuration</h3></div><div class="pb"><div class="kv"><dt>Materiality</dt><dd>Configured Value</dd><dt>Duplicate keys</dt><dd>Configured Value</dd><dt>Cutoff calendar</dt><dd>Configured Value</dd><dt>Rule-set version</dt><dd>Configured Value</dd><dt>Reproducible</dt><dd>Yes — deterministic, AI off</dd></div></div></div></div></div>`; }
function viewSettings(){ return `<div class="page">${pagehead("Administrator","Settings / Configuration","")}<div class="panel"><div class="pb"><p class="sec">Transparent, versioned configuration (Admin). <b>Prototype stub.</b></p><div class="kv"><dt>Variance materiality</dt><dd>Configured Value</dd><dt>Duplicate match keys</dt><dd>Configured Value</dd><dt>Cutoff calendar</dt><dd>Configured Value</dd><dt>AI provider</dt><dd>Not configured</dd><dt>Active theme</dt><dd>${state.theme}</dd><dt>Active lens</dt><dd>${state.lens}</dd></div></div></div></div>`; }
function viewHelp(){ return `<div class="page">${pagehead("Guidance","Help",finBtn("Help"))}<div class="panel"><div class="pb"><h3>How a finding is produced</h3><p>Verified data → a deterministic rule compares an observed value to a configured parameter → a finding with evidence and a one-click source trace. AI (Fin), if present, only explains.</p><h3>The 8 steps</h3><p>${STEP_LABELS.join(" · ")}. You always know which step you are on, what happened, and what's next.</p><h3>Glossary</h3><div class="kv"><dt>GED</dt><dd>General Expense Detail</dd><dt>EAC</dt><dd>Estimate at Completion (Actual + ETC)</dd><dt>ETC</dt><dd>Estimate to Complete</dd><dt>RAG</dt><dd>Red / Amber (Yellow) / Green status</dd><dt>Materiality</dt><dd>The configured threshold above which a variance becomes a finding</dd></div></div></div></div>`; }
/*__SUMMARY__*/
/* ================= COMPARE + WHAT'S NEW (functional) ================= */
function viewCompare(){ const t=totals(),A=accounts(),V=vendors();
  const accRows=A.map(a=>{ const pv=a.prior-a.budget; return {a,pv,delta:a.varAmt-pv}; }).sort((x,y)=>Math.abs(y.delta)-Math.abs(x.delta));
  const vmov=V.slice().sort((x,y)=>Math.abs(y.change)-Math.abs(x.change)).slice(0,6);
  return `<div class="page">${pagehead("Cross-cycle","Compare — July 2026 vs June 2026",finBtn("Compare July vs June"))}${lensBanner()}
    <div class="kpis">
      ${kpi("","Budget (both)",money(t.budget),"same budget basis")}
      ${kpi(t.mom>0?"k-dng":"k-ok","Actual",money(t.actual),`<span class="${t.momPct>0?'up':'down'}">${t.momPct>0?'▲':'▼'} ${pct(t.momPct)} vs June (${money(totals().priorActual)})</span>`)}
      ${kpi("","Change in spend",money(t.mom),"July − June")}
      ${kpi("","Findings now",FINDINGS.length,`${openFindings().length} open`)}
    </div>
    <div class="panel"><div class="ph"><h3>Account variance — this month vs prior</h3></div><div class="pb"><div class="tw"><table><thead><tr><th>Account</th><th class="num">Prior variance</th><th class="num">Current variance</th><th class="num">Movement</th></tr></thead><tbody>
      ${accRows.map(({a,pv,delta})=>`<tr class="click" onclick="acctDrawer('${a.code}')"><td>${a.code} ${esc(a.name)}</td><td class="num tnum ${pv>0?'unf':'fav'}">${money(pv)}</td><td class="num tnum ${a.varAmt>0?'unf':'fav'}">${money(a.varAmt)}</td><td class="num tnum ${delta>0?'unf':'fav'}">${delta>0?'▲ worse ':'▼ better '}${money(Math.abs(delta))}</td></tr>`).join("")}
    </tbody></table></div></div></div>
    <div class="grid g2">
      <div class="panel"><div class="ph"><h3>Vendor spend changes</h3></div><div class="pb"><div class="tw"><table><thead><tr><th>Vendor</th><th class="num">Prior</th><th class="num">Now</th><th class="num">Change</th></tr></thead><tbody>${vmov.map(v=>`<tr class="click" onclick="vendorDrawer('${esc(v.name)}')"><td>${esc(v.name)}</td><td class="num tnum">${money(v.prior)}</td><td class="num tnum">${money(v.spend)}</td><td class="num tnum ${v.change>0?'unf':'fav'}">${money(v.change)} (${pct(v.changePct)})</td></tr>`).join("")}</tbody></table></div></div></div>
      <div class="panel"><div class="ph"><h3>Findings &amp; quality changes</h3></div><div class="pb"><ul style="margin:0;padding-left:18px;font-size:.86rem;">
        <li>New findings this month: ${FINDINGS.filter(f=>f.status==="New").length}</li>
        <li>Resolved / dismissed: ${FINDINGS.filter(f=>["Resolved","Dismissed"].includes(f.status)).length}</li>
        <li>Severity mix: ${(()=>{const s=sevCounts(FINDINGS);return `${s.critical}C · ${s.high}H · ${s.medium}M · ${s.low}L`;})()}</li>
        <li>Data quality: verification ${verifiedPct()}% (prior period: Configured Value)</li>
        <li>Major movement: Contract Labor and Professional Services drove most of the increase.</li></ul></div></div>
    </div></div>`; }
function viewWhatsNew(){ const A=accounts(),V=vendors();
  const newlyOver=A.filter(a=>a.varAmt>0 && (a.prior-a.budget)<=0);
  const movedFav=A.filter(a=>a.varAmt<=0 && (a.prior-a.budget)>0);
  const bigUp=V.filter(v=>v.changePct>0.10).sort((x,y)=>y.change-x.change);
  const bigDown=V.filter(v=>v.changePct<-0.05).sort((x,y)=>x.change-y.change);
  const resolved=FINDINGS.filter(f=>f.status==="Resolved");
  const item=(icon,cls,text)=>`<div class="alert ${cls}"><span class="ai">${icon}</span><div>${text}</div></div>`;
  return `<div class="page">${pagehead("Cross-cycle","What's New — July 2026",finBtn("What's New"))}${lensBanner()}
    <p class="sec"><b>New does not mean wrong.</b> Change is surfaced separately from findings so you are informed without alarm. A new item becomes a finding only if a rule independently fires.</p>
    <div class="panel"><div class="ph"><h3>Changes for attention</h3></div><div class="pb">
      ${item("✦","info","<b>New vendors:</b> none this period (all vendors appeared in June).")}
      ${bigUp.map(v=>item("▲","warn",`<b>${esc(v.name)}</b> increased ${money(v.change)} (${pct(v.changePct)}).`)).join("")}
      ${bigDown.map(v=>item("▼","ok",`<b>${esc(v.name)}</b> decreased ${money(Math.abs(v.change))} (${pct(v.changePct)}).`)).join("")}
      ${newlyOver.length?newlyOver.map(a=>item("▲","warn",`<b>${a.code} ${esc(a.name)}</b> is newly over budget this month.`)).join(""):item("✓","ok","No accounts newly over budget vs prior.")}
      ${movedFav.map(a=>item("▼","ok",`<b>${a.code} ${esc(a.name)}</b> moved from over to under budget.`)).join("")}
      ${item("◈","info","<b>New unmatched record:</b> Northstar credit −$4,200 (now a reconciliation finding).")}
      ${resolved.map(f=>item("✓","ok",`<b>Newly resolved:</b> ${esc(f.title)} — ${esc(f.entity||entityOf(f))}.`)).join("")}
      ${item("ℹ","info","<b>Data:</b> no newly missing or restored sources vs prior period.")}
    </div></div></div>`; }
/*__COMPARE__*/
/* ================= ASK FIN (grounded, explain-only, predefined) ================= */
const FIN_SAMPLES=["What changed from last month?","Which vendors drove the increase in spending?","Which accounts are over budget?","Show the largest unfavorable variances.","Which findings still need attention?","What decisions are needed?","Is the dataset complete?"];
function citeBtns(cites){ if(!cites||!cites.length) return ""; return `<div class="btnrow" style="margin-top:6px;">`+cites.map(c=>{ if(c.t==="a")return `<button class="btn btn-g btn-sm" onclick="acctDrawer('${c.v}')">${c.v} ›</button>`; if(c.t==="v")return `<button class="btn btn-g btn-sm" onclick="vendorDrawer('${esc(c.v)}')">${esc(c.v)} ›</button>`; if(c.t==="f")return `<button class="btn btn-g btn-sm" onclick="explainFinding('${c.v}')">${c.v} ›</button>`; return ""; }).join("")+`</div>`; }
function finAnswer(qraw){ const q=qraw.toLowerCase(); const t=totals(),A=accounts(),V=vendors();
  function ans(facts,narration,cites){ return {facts,narration,cites}; }
  if(/(chang|last month|prior|vs june|month-over)/.test(q)){ const up=V.filter(v=>v.change>0).sort((a,b)=>b.change-a.change).slice(0,2); return ans([`Total spend: ${money(t.actual)} (July) vs ${money(t.priorActual)} (June) — ${pct(t.momPct)}.`,`Largest increases: ${up.map(v=>v.name+" "+money(v.change)).join("; ")}.`],`Spending rose ${money(t.mom)} versus June, driven mainly by contract labor and professional services. This is a change summary, not a judgement — see Findings for what a rule flagged.`,up.map(v=>({t:"v",v:v.name}))); }
  if(/(drove|increase|which vendor|top vendor|vendor.*spend)/.test(q)){ const up=V.slice().sort((a,b)=>b.change-a.change).slice(0,3); return ans(up.map(v=>`${v.name}: ${money(v.spend)} (${v.change>0?'+':''}${money(v.change)} vs prior)`),`These vendors account for most of the movement. Amounts are deterministic from the verified GED; Fin is only summarising them.`,up.map(v=>({t:"v",v:v.name}))); }
  if(/(over budget|overspend|unfavorable|largest.*variance|variance)/.test(q)){ const unf=A.filter(a=>a.varAmt>0).sort((a,b)=>b.varAmt-a.varAmt); return ans(unf.map(a=>`${a.code} ${a.name}: over by ${money(a.varAmt)} (${pct(a.varPct)})`),`${unf.length} accounts are over budget. Whether each is "material" depends on the configured materiality setting (Configured Value); those crossing it appear in Findings.`,unf.slice(0,4).map(a=>({t:"a",v:a.code}))); }
  if(/(finding|attention|need.*attention|unresolved)/.test(q)){ const o=openFindings(); const s=sevCounts(o); return ans([`${o.length} open findings: ${s.critical} Critical, ${s.high} High, ${s.medium} Medium, ${s.low} Low.`,...o.slice(0,3).map(f=>`${f.id} ${f.title} — ${entityOf(f)}`)],`Critical and High findings should be reviewed first. Fin can explain any finding in plain language — open “Explain This”.`,o.slice(0,3).map(f=>({t:"f",v:f.id}))); }
  if(/(decision|approve|judgement|judgment)/.test(q)){ const d=decisionsList(); return ans(d.map(f=>`${f.id} ${f.title} — ${entityOf(f)}`),`${d.length} conditions need human judgement. Fin surfaces them with evidence and possible next actions, but never makes the decision.`,d.map(f=>({t:"f",v:f.id}))); }
  if(/(complete|dataset|verified|coverage|data quality)/.test(q)){ const c=coverage(); return ans([`${verifiedPct()}% of extracted rows verified.`,`${c.totalRows} rows · ${c.lowConf} low-confidence · ${c.duplicates} duplicate candidate · ${c.rejected} rejected.`,`Capabilities run: Budget, GED, Reconciliation. Skipped: Invoice, Resource.`],`Results are complete for the capabilities that ran. Invoice and Resource analysis were skipped because those sources were not provided.`,null); }
  if(/summar/.test(q)){ const v=V.find(x=>q.includes(x.name.toLowerCase().split(" ")[0])); if(v) return ans([`${v.name}: ${money(v.spend)} across accounts ${v.accounts.join(", ")} (${v.count} txns).`,`Change vs prior: ${money(v.change)} (${pct(v.changePct)}).`],`Summary of ${v.name} from verified records; open the vendor to drill into transactions.`,[{t:"v",v:v.name}]); }
  if(/(source|records behind|evidence|trace)/.test(q)){ return ans([`Every figure traces to a source GED row (file › sheet › row › cell).`],`Open any account, vendor, or finding and use “Source” / “View source record” to see the exact origin. Fin never invents a figure — it points you to the record.`,null); }
  if(/explain/.test(q)){ const f=openFindings()[0]; return ans([f?`Example: ${f.id} — ${f.title}`:"No open findings."],`Open a finding and choose “Explain This” for a plain-language explanation (what happened, why flagged, why it matters) with evidence. Deterministic and available with AI off.`,f?[{t:"f",v:f.id}]:null); }
  return ans([`Total budget ${money(t.budget)}, actual ${money(t.actual)} (${pct(t.varPct)}), ${openFindings().length} open findings.`],`I can answer questions about spend, vendors, accounts, findings, decisions and data completeness — all from the verified synthetic data. Try a suggested question.`,null); }

function renderFinBody(){ const log=state.finLog||[]; const ctxQs=finContextQuestions();
  const msgs=log.map(m=> m.who==="you"?`<div class="finmsg"><div class="who">You</div><div>${esc(m.text)}</div></div>`
    :`<div class="finmsg"><div class="who">✦ Fin — deterministic facts</div><div class="factbox">${m.a.facts.map(x=>`<div>• ${esc(x)}</div>`).join("")}</div><div class="who" style="margin-top:6px;">Explanation</div><div style="font-size:.86rem;">${esc(m.a.narration)}</div>${citeBtns(m.a.cites)}</div>`).join("");
  return `<div style="font-size:.78rem;color:var(--tm);margin-bottom:10px;">Context: <b>${esc(state.finContext)}</b>. Fin explains deterministic results — it never creates financial values, findings, or actions (DEC-005).</div>
    ${msgs||`<div class="finmsg"><div class="who">✦ Fin</div><div style="font-size:.86rem;">Hello — I explain your verified July 2026 review. Ask about spend, vendors, accounts, findings, decisions, or data completeness. I only summarise deterministic results.</div></div>`}
    <div style="margin-top:10px;"><div class="ov" style="margin-bottom:6px;">Suggested questions</div>${ctxQs.concat(FIN_SAMPLES).filter((v,i,a)=>a.indexOf(v)===i).slice(0,8).map(q=>`<button class="finq" onclick="finAsk('${esc(q).replace(/'/g,"&#39;")}')">${esc(q)}</button>`).join("")}</div>
    <div class="btnrow" style="margin-top:8px;"><input id="finInput" placeholder="Ask Fin about this review…" style="flex:1;font:inherit;padding:8px 10px;border:1px solid var(--bstrong);border-radius:var(--r-md);background:var(--raised);color:var(--tp);" onkeydown="if(event.key==='Enter'){finAsk(this.value);}"><button class="btn btn-fin btn-sm" onclick="finAsk(document.getElementById('finInput').value)">Ask</button></div>`; }
function finContextQuestions(){ const c=state.finContext||""; if(/Vendor:/.test(c)){ const n=c.split("Vendor:")[1].trim(); return [`Summarize ${n.split(" ")[0]}`,"Which vendors drove the increase in spending?"]; } if(/Finding|Decision/.test(c)) return ["Explain this finding in simple language","What decisions are needed?"]; if(/Vendor/.test(c)) return ["Which vendors drove the increase in spending?","Show the largest unfavorable variances."]; if(/[Aa]ccount/.test(c)) return ["Which accounts are over budget?","Show the largest unfavorable variances."]; if(/Summary/.test(c)) return ["What changed from last month?","Which findings still need attention?"]; return ["What changed from last month?","Which accounts are over budget?"]; }
function askFin(ctx){ if(ctx) state.finContext=ctx; state.finLog=state.finLog||[]; $("#finBody").innerHTML=renderFinBody(); $("#scrim").classList.add("open"); $("#finPanel").classList.add("open"); const i=$("#finInput"); if(i) i.focus(); }
function finAsk(q){ q=(q||"").trim(); if(!q) return; state.finLog=state.finLog||[]; state.finLog.push({who:"you",text:q}); state.finLog.push({who:"fin",a:finAnswer(q)}); $("#finBody").innerHTML=renderFinBody(); const b=$("#finBody"); b.scrollTop=b.scrollHeight; }
/*__ASKFIN__*/
/* ================= INTERACTIONS + ROUTER ================= */
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>go(b.getAttribute("data-nav"))));
$("#themeBtn").addEventListener("click",()=>{ state.theme=state.theme==="light"?"dark":"light"; document.documentElement.setAttribute("data-theme",state.theme); toast("Theme: "+state.theme); });
$("#textBtn").addEventListener("click",()=>{ const o=["default","large","larger"]; state.textSize=o[(o.indexOf(state.textSize)+1)%3]; document.documentElement.setAttribute("data-textsize",state.textSize); toast("Text size: "+state.textSize); });
$("#lensSel").addEventListener("change",e=>{ state.lens=e.target.value; render(); toast(state.lens+" lens"); });
$("#periodSel").addEventListener("change",e=>{ state.period=e.target.value; if(e.target.value!=="July 2026"){ toast("Prototype data is populated for July 2026"); } render(); });
function finCtxForView(){ const m={dashboard:"Dashboard",review:"Financial review",findings:"Findings",decisions:"Decisions",summary:"Leadership summary",compare:"Compare",whatsnew:"What's New",verify:"Verification",audit:"Audit"}; return m[state.view]||"FinSight"; }
$("#finBtnTop").addEventListener("click",()=>askFin(finCtxForView()));
$("#finBtnSide").addEventListener("click",()=>askFin(finCtxForView()));

const VIEWS={ welcome:viewWelcome, selectpast:viewSelectPast, dashboard:viewDashboard, history:viewHistory, create:viewCreate, upload:viewUpload, validate:viewValidate, processing:viewProcessing, verify:viewVerify, analyze:viewAnalyze, review:viewReview, findings:viewFindings, decisions:viewDecisions, summary:viewSummary, complete:viewComplete, compare:viewCompare, whatsnew:viewWhatsNew, audit:viewAudit, settings:viewSettings, help:viewHelp };
function render(){
  const r=curr();
  const inFlow=["upload","validate","processing","verify","analyze","review","summary","complete"].includes(state.view);
  $("#topReview").textContent = (r&&inFlow) ? `${r.month} ${r.year} Review` : "FinSight";
  document.querySelectorAll("[data-nav]").forEach(b=>b.setAttribute("aria-current", b.getAttribute("data-nav")===state.view?"page":"false"));
  $("#navFind").textContent=openFindings().length; $("#navDec").textContent=decisionsList().length;
  const wizardOnly=["upload","validate","processing","verify","analyze","complete"];
  if(wizardOnly.includes(state.view)&&!r){ state.view="welcome"; }
  // Gate: never show a financial screen (esp. the dashboard) before the user creates or opens a review.
  if(state.view==="dashboard" && !state.selectedReviewId){ state.view="welcome"; }
  const financial=["review","findings","decisions","summary","compare","whatsnew","audit"];
  if(financial.includes(state.view) && !state.currentReviewId){ state.view="welcome"; toast("Create or open a review first"); }
  $("#main").innerHTML=(VIEWS[state.view]||viewWelcome)();
}
/*__INTERACT__*/
/* ================= BOOT ================= */
document.documentElement.setAttribute("data-theme","light");
render();
/*__BOOT__*/
</script>
