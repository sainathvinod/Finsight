[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "2.0.0"
description = "FinSight — deterministic monthly financial-review desktop application (Version 2)."
# Intentional floor: pytest 9.x / coverage 7.15.x require >=3.10, and 3.9 is EOL (2025-10).
# Recommended build interpreter: 3.12. Single source of truth for pins: build/versions.json.
requires-python = ">=3.10"
dependencies = [
    "openpyxl==3.1.5",
    "cryptography==49.0.0",
    "sqlcipher3==0.6.2",
]

# Launch command created on install: `finsight` (needs the [desktop] extra for PySide6).
[project.scripts]
finsight = "finsight.delivery.desktop.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Pinned intentionally; verified installable under Python 3.11. Mirrors requirements-dev.txt.
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "import-linter==2.13",
    "ruff==0.15.22",
    "coverage==7.15.2",
]
# Desktop UI (delivery ring). NOT a core runtime dependency — the deterministic workflow runs
# without PySide6. Install with:  pip install -e ".[dev,desktop]"
desktop = [
    "PySide6==6.11.1",
    "QtAwesome==1.4.2",
    "QtPy==2.4.3",
]

[tool.pytest.ini_options]
markers = ["unit","golden","determinism","fitness","audit","accessibility","security","ui","integration","migration"]

[tool.ruff]
target-version = "py310"
