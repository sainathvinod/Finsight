# FinSight — macOS release pipeline (secondary target).
#
# Windows is the primary delivery target; this workflow keeps the macOS build honest and
# reproducible so the macOS milestone starts from a working pipeline rather than a blank page.
#
# KNOWN, DEFERRED macOS DEFECT — read before distributing anything built here.
#   The macOS store-key provider writes the key to the login keychain trusting the application
#   binary, but reads it back by shelling out to /usr/bin/security, which is not on the item's
#   ACL. macOS therefore raises an authorization prompt on the SECOND and every later launch, and
#   the 15-second subprocess timeout turns a slow click into a hard startup failure. The smoke
#   step below is expected to expose this on a re-run against an existing keychain item.
#   Fix before the macOS milestone: add /usr/bin/security to the trusted apps in
#   MacOSKeychainStoreKeyProvider._save(). Not a Windows blocker.
name: release-macos

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with the macOS bundle"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out the release candidate
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned runtime, desktop, and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install "pyinstaller==6.21.0"

      - name: Verify runtime imports resolve on macOS
        env:
          PYTHONPATH: src
        run: python -c "import sqlcipher3, cryptography, openpyxl, PySide6, qtawesome, finsight; print('runtime imports OK')"

      - name: Run the test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Check architecture contracts
        env:
          PYTHONPATH: src
        run: lint-imports

      # The Windows spec is reused deliberately: PyInstaller always targets the host, so this
      # produces a macOS bundle and simultaneously proves the shared spec stays buildable.
      # A dedicated .app/.dmg spec with signing and notarization belongs to the macOS milestone.
      - name: Freeze the application with PyInstaller
        run: python -m PyInstaller --clean --noconfirm build/windows/finsight.spec

      - name: Verify the frozen bundle is complete
        run: |
          test -x dist/FinSight/FinSight || { echo "executable not produced"; exit 1; }
          count=$(find dist/FinSight -path '*qtawesome*' -name '*.ttf' | wc -l | tr -d ' ')
          test "$count" -ge 1 || { echo "QtAwesome fonts missing from the bundle"; exit 1; }
          echo "bundle OK - $count icon font files present"

      - name: Packaged launch smoke test
        continue-on-error: true    # see the deferred keychain defect documented at the top
        env:
          FINSIGHT_SMOKE: "1"
        run: |
          ./dist/FinSight/FinSight
          echo "smoke exit code: $?"

      - name: Archive the macOS bundle
        run: |
          cd dist && tar -czf FinSight-macOS.tar.gz FinSight

      - name: Upload the macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: FinSight-macOS-Bundle
          path: dist/FinSight-macOS.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FinSight-macOS.tar.gz
          generate_release_notes: true
          body: |
            ## FinSight — macOS bundle (unsigned, pre-milestone)

            Not for distribution to end users. This bundle is neither Developer ID signed nor
            notarized, and the known second-launch keychain defect is not yet fixed.
